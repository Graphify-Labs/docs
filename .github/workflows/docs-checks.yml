name: Docs checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs.json and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: docs.json is valid JSON
        run: python3 -m json.tool docs.json > /dev/null

      - name: Every nav page exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          cfg = json.load(open("docs.json"))
          pages = []
          def walk(n):
              if isinstance(n, dict):
                  for k, v in n.items():
                      if k in ("pages", "root") :
                          for p in (v if isinstance(v, list) else [v]):
                              if isinstance(p, str): pages.append(p)
                              else: walk(p)
                      else: walk(v)
              elif isinstance(n, list):
                  for x in n: walk(x)
          walk(cfg.get("navigation", {}))
          missing = [p for p in pages if not p.startswith("http") and not any(os.path.exists(p + e) for e in (".mdx", ".md"))]
          if missing:
              print("Pages in docs.json with no file:", *missing, sep="\n  ")
              sys.exit(1)
          print(f"{len(pages)} nav pages found")
          PY

      - name: Every redirect destination exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          redirects = json.load(open("docs.json")).get("redirects", [])
          bad = []
          for r in redirects:
              d = r.get("destination", "").split("#")[0].split("?")[0]
              if d.startswith("http") or ":" in d or "*" in d:
                  continue  # external or pattern destinations are not checked
              path = d.strip("/") or "index"
              if not any(os.path.exists(path + e) for e in (".mdx", ".md", "/index.mdx")):
                  bad.append(f"{r.get('source')} -> {r.get('destination')}")
          if bad:
              print("Redirects pointing at missing pages:", *bad, sep="\n  ")
              sys.exit(1)
          print(f"{len(redirects)} redirects OK")
          PY

      - name: Title and description length (title <= 60, description <= 155)
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in sorted(glob.glob("**/*.mdx", recursive=True)):
              if f.startswith(("snippets/", "node_modules/")):
                  continue
              m = re.match(r"---\n(.*?)\n---", open(f, encoding="utf-8").read(), re.S)
              if not m:
                  continue
              for key, limit in (("title", 60), ("description", 155)):
                  v = re.search(rf'^{key}:\s*"?(.*?)"?\s*$', m.group(1), re.M)
                  if v and len(v.group(1)) > limit:
                      bad.append(f"{f}: {key} is {len(v.group(1))} chars (max {limit})")
          if bad:
              print("Frontmatter over the SEO limits:", *bad, sep="\n  ")
              sys.exit(1)
          print("Titles and descriptions are within limits")
          PY

      - name: Page icons (missing warns, duplicate in a group fails)
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          cfg = json.load(open("docs.json"))
          groups = []  # (label, [page paths])
          def walk(n, label):
              if isinstance(n, dict):
                  lab = n.get("group") or label
                  if "tab" in n: lab = n["tab"]
                  if "pages" in n and "group" in n:
                      groups.append((f"{label} > {n['group']}", [p for p in n["pages"] if isinstance(p, str)]))
                  for k, v in n.items():
                      walk(v, f"{label} > {n['group']}" if "group" in n else (n.get("tab") or label))
              elif isinstance(n, list):
                  for x in n: walk(x, label)
          walk(cfg.get("navigation", {}), "")
          def icon(p):
              f = next((p + e for e in (".mdx", ".md") if os.path.exists(p + e)), None)
              if not f: return f, None
              m = re.match(r"---\n(.*?)\n---", open(f, encoding="utf-8").read(), re.S)
              i = m and re.search(r"^icon:\s*[\"']?([^\"'\s]+)", m.group(1), re.M)
              return f, (i.group(1) if i else None)
          total = missing = 0; dupes = []
          for label, pages in groups:
              seen = {}
              for p in pages:
                  f, i = icon(p)
                  if not f: continue
                  total += 1
                  if not i:
                      missing += 1
                      print(f"::warning file={f}::Page has no icon: in its frontmatter. See 'Page icons' in CONTRIBUTING.md.")
                  elif i in seen:
                      dupes.append(f)
                      print(f"::error file={f}::Icon '{i}' is already used by {seen[i]} in sidebar group '{label.strip(' >')}'. Pick another icon.")
                  else:
                      seen[i] = f
          print(f"{total - missing}/{total} nav pages have an icon; {len(dupes)} duplicate icon(s) within a group")
          sys.exit(1 if dupes else 0)
          PY

      - name: No description starts with a tag
        run: |
          if grep -rnE '^description: *"?\[' --include='*.mdx' --include='*.md' .; then
            echo "Descriptions must read as sentences. Put the surface in the surface: field instead."
            exit 1
          fi

      - name: New or changed images stay under 400 KB
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAX_KB: 400
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            kb=$(( $(stat -c %s "$f") / 1024 ))
            if [ "$kb" -gt "$MAX_KB" ]; then
              echo "::error file=$f::$f is ${kb} KB (budget ${MAX_KB} KB). Export WebP or AVIF at about 2x its display size."
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD | grep -iE '\.(png|jpe?g|gif|webp|avif|svg)$' || true)
          [ "$fail" -eq 0 ] && echo "All new or changed images are within ${MAX_KB} KB"
          exit $fail

      - name: Mintlify broken links
        run: npx -y mint@4.2.1152 broken-links
