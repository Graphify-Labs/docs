name: Docs checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs.json and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: docs.json is valid JSON
        run: python3 -m json.tool docs.json > /dev/null

      - name: Every nav page exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          cfg = json.load(open("docs.json"))
          pages = []
          def walk(n):
              if isinstance(n, dict):
                  for k, v in n.items():
                      if k in ("pages", "root") :
                          for p in (v if isinstance(v, list) else [v]):
                              if isinstance(p, str): pages.append(p)
                              else: walk(p)
                      else: walk(v)
              elif isinstance(n, list):
                  for x in n: walk(x)
          walk(cfg.get("navigation", {}))
          missing = [p for p in pages if not p.startswith("http") and not any(os.path.exists(p + e) for e in (".mdx", ".md"))]
          if missing:
              print("Pages in docs.json with no file:", *missing, sep="\n  ")
              sys.exit(1)
          print(f"{len(pages)} nav pages found")
          PY

      - name: Every redirect destination exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          redirects = json.load(open("docs.json")).get("redirects", [])
          bad = []
          for r in redirects:
              d = r.get("destination", "").split("#")[0].split("?")[0]
              if d.startswith("http") or ":" in d or "*" in d:
                  continue  # external or pattern destinations are not checked
              path = d.strip("/") or "index"
              if not any(os.path.exists(path + e) for e in (".mdx", ".md", "/index.mdx")):
                  bad.append(f"{r.get('source')} -> {r.get('destination')}")
          if bad:
              print("Redirects pointing at missing pages:", *bad, sep="\n  ")
              sys.exit(1)
          print(f"{len(redirects)} redirects OK")
          PY

      - name: Every nav page has an icon
        run: |
          python3 - <<'PY'
          import json, os, re
          cfg = json.load(open("docs.json"))
          pages = []
          def walk(n):
              if isinstance(n, dict):
                  for k, v in n.items():
                      if k in ("pages", "root"):
                          for p in (v if isinstance(v, list) else [v]):
                              if isinstance(p, str): pages.append(p)
                              else: walk(p)
                      else: walk(v)
              elif isinstance(n, list):
                  for x in n: walk(x)
          walk(cfg.get("navigation", {}))
          missing = []
          for p in pages:
              f = next((p + e for e in (".mdx", ".md") if os.path.exists(p + e)), None)
              if not f: continue
              m = re.match(r"---\n(.*?)\n---", open(f, encoding="utf-8").read(), re.S)
              if not m or not re.search(r"^icon:\s*\S", m.group(1), re.M):
                  missing.append(f)
          for f in missing:
              print(f"::warning file={f}::Page has no icon: in its frontmatter. See 'Page icons' in CONTRIBUTING.md.")
          print(f"{len(pages) - len(missing)}/{len(pages)} nav pages have an icon")
          PY

      - name: No description starts with a tag
        run: |
          if grep -rnE '^description: *"?\[' --include='*.mdx' --include='*.md' .; then
            echo "Descriptions must read as sentences. Put the surface in the surface: field instead."
            exit 1
          fi

      - name: New or changed images stay under 400 KB
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAX_KB: 400
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            kb=$(( $(stat -c %s "$f") / 1024 ))
            if [ "$kb" -gt "$MAX_KB" ]; then
              echo "::error file=$f::$f is ${kb} KB (budget ${MAX_KB} KB). Export WebP or AVIF at about 2x its display size."
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD | grep -iE '\.(png|jpe?g|gif|webp|avif|svg)$' || true)
          [ "$fail" -eq 0 ] && echo "All new or changed images are within ${MAX_KB} KB"
          exit $fail

      - name: Mintlify broken links
        run: npx -y mint@4.2.1152 broken-links
